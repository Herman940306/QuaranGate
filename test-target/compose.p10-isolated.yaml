# P10 qualification-only isolation for the disposable demo/decoy target pair.
# The base test target remains unchanged for ordinary development.
name: ${QG_P10_TARGET_PROJECT:?set isolated QG_P10_TARGET_PROJECT}

services:
  dev:
    build:
      network: none
      pull: false
    image: ${QG_P10_TARGET_IMAGE:?set isolated QG_P10_TARGET_IMAGE}
    pull_policy: never
    container_name: ${QG_P10_TARGET_DEV_CONTAINER:?set isolated QG_P10_TARGET_DEV_CONTAINER}

  decoy:
    image: ${QG_P10_TARGET_DECOY_IMAGE:?set digest-pinned QG_P10_TARGET_DECOY_IMAGE}
    pull_policy: never
    container_name: ${QG_P10_TARGET_DECOY_CONTAINER:?set isolated QG_P10_TARGET_DECOY_CONTAINER}
