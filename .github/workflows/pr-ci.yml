name: PR CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Security invariants when available
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/security-invariants.mjs ]; then
            node scripts/security-invariants.mjs
          else
            printf '%s\n' 'security-invariants.mjs not present on this source line; skipped.'
          fi

      - name: Diff hygiene
        run: git diff --check
