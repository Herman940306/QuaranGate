# QuaranGate Ollama O1 — Optional Runtime Override
#
# Adds Ollama service + inference network for governed read-only agent backend.
# Deploy with: docker compose -f compose.yaml -f compose.ollama.yaml up -d
#
# O1 IS READ-ONLY: audit/plan/review profiles only. Writer/implement profiles
# are hard-refused by the backend before inference. No artifact production,
# no host mutation, no model selection defaults.

services:
  # Attach executor to inference network (executor → Ollama communication only)
  executor:
    networks:
      - internal
      - inference
    environment:
      # O1 Ollama backend configuration (TRUSTED, never caller-selectable)
      OLLAMA_HOST: "http://ollama:11434"
      OLLAMA_MODEL_QUALIFIER: "${OLLAMA_MODEL_QUALIFIER:?set OLLAMA_MODEL_QUALIFIER in .env (no :latest default)}"
      # Generic helper image for read operations (must be explicit when Ollama enabled)
      AGENT_HELPER_IMAGE: "${AGENT_HELPER_IMAGE:?set qualified AGENT_HELPER_IMAGE}"
      AGENT_STAGER_IMAGE: "${AGENT_STAGER_IMAGE:?set qualified AGENT_STAGER_IMAGE}"

  # Ollama inference service (internal network only, no host ports)
  ollama:
    image: "${OLLAMA_IMAGE:?set digest-pinned OLLAMA_IMAGE in .env (@sha256 required)}"
    pull_policy: never  # Fail closed if image not pre-pulled
    container_name: quarangate-ollama
    restart: unless-stopped
    networks:
      - inference
    volumes:
      - ollama-models:/model-store:ro
    tmpfs:
      - /root/.ollama:rw,noexec,nosuid,nodev,size=16m
      - /tmp:rw,nosuid,nodev,size=256m
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_MODELS=/model-store/models
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH:?set qualified OLLAMA_CONTEXT_LENGTH}
      - OLLAMA_NO_CLOUD=1
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
    # NO published ports — internal network only
    cpus: "${OLLAMA_CPU_LIMIT:?set qualified OLLAMA_CPU_LIMIT}"
    mem_limit: "${OLLAMA_MEM_LIMIT:?set qualified OLLAMA_MEM_LIMIT}"
    pids_limit: "${OLLAMA_PIDS_LIMIT:?set qualified OLLAMA_PIDS_LIMIT}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids:
                - "${OLLAMA_GPU_DEVICE:?set qualified OLLAMA_GPU_DEVICE}"
              capabilities:
                - gpu
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
    # Security hardening
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true

networks:
  # Inference network: executor ↔ Ollama only, internal (no external routing)
  inference:
    name: quarangate-inference
    internal: true

volumes:
  # Externally provisioned verified O1 model store; Compose consumes it but
  # does not own its lifecycle. It must not carry sandbox-managed ownership
  # labels.
  ollama-models:
    name: quarangate-ollama-models
    external: true
