# Owner-authorized umbrella target for the developer's projects tree.
# This intentionally grants broad read/write project authority while keeping
# Docker administration inside QuaranGate's private executor.
#
# Required host input:
#   PROJECTS_ROOT=/home/<user>/projects
#
# Explicit non-authorities:
#   - NO /var/run/docker.sock
#   - NO broader home-directory bind
#   - NO privileged mode / added capabilities
name: projects-work

services:
  work:
    image: ${PROJECTS_WORK_IMAGE:-assistant-environment-work:latest}
    container_name: projects-work
    working_dir: /workspace
    user: "1000:1000"
    labels:
      mcp.bridge.enabled: "true"
      mcp.bridge.workspace: "/workspace"
      mcp.bridge.name: "projects-work"
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    volumes:
      - ${PROJECTS_ROOT:?set PROJECTS_ROOT}:/workspace:rw
    tmpfs:
      - /tmp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: false
    pids_limit: 512
    mem_limit: 2g
