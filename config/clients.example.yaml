# Client principals. Copy to config/clients.yaml (gitignored).
# NEVER put raw API keys here — only their sha256 hash. Generate with:
#   npm run gen-key -- claude-browser
# which prints the key ONCE and writes the hash below.

clients:
  - id: claude-browser
    name: Claude Browser
    keyHash: "<sha256-of-key>"      # from: npm run gen-key -- claude-browser
    enabled: true
    scopes:
      - targets:read
      - files:read
      - files:write
      - files:delete
      - terminal:exec
      - git:read
      - process:read
    targets: ["demo"]               # explicit ids, or ["*"] for all CONFIGURED targets
    rateLimit: 120                  # requests/min (optional)

  - id: chatgpt-browser
    name: ChatGPT Browser
    keyHash: "<sha256-of-key>"
    enabled: true
    scopes: [targets:read, files:read, files:write, terminal:exec, git:read]
    targets: ["demo"]
    rateLimit: 120

  - id: vscode
    name: VS Code
    keyHash: "<sha256-of-key>"
    enabled: true
    scopes: [targets:read, files:read, files:write, files:delete, terminal:exec, git:read, process:read]
    targets: ["*"]

  - id: kiro
    name: Kiro
    keyHash: "<sha256-of-key>"
    enabled: true
    scopes: [targets:read, files:read, files:write, terminal:exec, git:read]
    targets: ["demo"]

  # ---------------------------------------------------------------------------
  # Agent Control Plane grants. All nine agent tools are live (agents_list,
  # agent_projects, agent_dispatch, agent_status, agent_result, agent_cancel,
  # agent_diff, agent_apply, agent_discard), so these grants are enforced.
  #
  # Agent access is DENY BY DEFAULT: clients without the agents:* scopes AND
  # the matching projects/agentBackends/agentProfiles grants have ZERO agent
  # privileges. Target permission does NOT imply project permission. "*" means
  # every entry of the trusted configured agent registry (config/agents.yaml),
  # never arbitrary host resources.
  # ---------------------------------------------------------------------------

  - id: chatgpt-orchestrator
    name: ChatGPT Orchestrator (example agent client)
    keyHash: "<sha256-of-key>"
    enabled: true
    scopes: [agents:read, agents:dispatch, agents:cancel]
    targets: []                       # agent grants are separate from targets
    projects: ["example-project"]     # logical ids from config/agents.yaml
    agentBackends: ["kiro"]
    agentProfiles: [audit, plan]
    rateLimit: 60

  # HIGH PRIVILEGE EXAMPLE — agents:apply lets this client mutate the real
  # project after review. Grant it deliberately and sparingly.
  - id: agent-applier
    name: Agent Apply Authority (example, high privilege)
    keyHash: "<sha256-of-key>"
    enabled: false                    # disabled by default even as an example
    scopes: [agents:read, agents:dispatch, agents:cancel, agents:apply]
    targets: []
    projects: ["example-project"]
    agentBackends: ["kiro"]
    agentProfiles: [audit, plan, implement, review]
    rateLimit: 30
