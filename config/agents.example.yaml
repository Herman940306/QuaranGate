# EXAMPLE ONLY — NOT LIVE CONFIGURATION.
#
# Trusted Agent Control Plane registry.
# Copy to config/agents.yaml (gitignored) to enable agent execution. The
# executor loads it at startup from AGENTS_CONFIG (default /config/agents.yaml)
# and validates it strictly. The file is OPTIONAL: when it is absent the
# executor logs "agent control plane not configured (optional)", the agent
# routes fail closed with AGENTS_UNAVAILABLE, and the rest of the bridge runs
# exactly as before.
#
# SECURITY: everything in this file is TRUSTED, executor-owned configuration.
# hostPath, backends, profiles and resource policies are never accepted from
# MCP callers — public callers address logical project ids only.

backends:
  - id: kiro
    enabled: true
    profiles: [audit, plan, implement, review]
    defaultResourcePolicy: standard
    # No transport field here: Kiro targets ACP; transport-specific runtime
    # configuration belongs to the backend adapter phase (A4).

  - id: copilot
    enabled: false                       # transport decision deferred to A7
    profiles: [audit, review]
    defaultResourcePolicy: economy

  # O1 Ollama read-only backend. Disabled by default (safe deployable state).
  # Enable only after setting OLLAMA_HOST, OLLAMA_MODEL_QUALIFIER, and
  # AGENT_HELPER_IMAGE in .env (or compose.ollama.yaml). NO default model,
  # NO :latest. Supported profiles: audit, plan, review only.
  #
  # OWNER-APPROVED PRIMARY MODEL (Q1D-qualified): qwen3.5:4b-q4_K_M
  # No material degradation observed in the bounded O1 qualification suite.
  # Capacity reserve: qwen3.5:9b-q4_K_M ; Qualified alternate: ministral-3:8b-instruct-2512-q4_K_M
  - id: ollama
    enabled: false                       # safe default; enable post-deployment
    profiles: [audit, plan, review]      # implement/writer is hard-refused
    defaultResourcePolicy: economy

projects:
  - id: example-project
    hostPath: /srv/projects/example-project   # neutral example path
    gitRequired: true
    backends: [kiro]
    profiles: [audit, plan, implement, review]
    guardedPaths:                        # refused/harder-gated by agent_apply
      - .env
      - config/clients.yaml
      - config/bridge.yaml
      - "**/*.pem"
      - "**/id_rsa*"
    sensitiveReadGlobs: []               # no additional Ollama read restrictions

  - id: example-docs
    hostPath: /srv/projects/example-docs
    gitRequired: true
    backends: [kiro, copilot]
    profiles: [audit, plan]              # read-only lanes only
    guardedPaths: [.env]
    sensitiveReadGlobs: []

  # Example project allowing Ollama O1 read-only analysis
  - id: example-ollama-project
    hostPath: /srv/projects/example-ollama-project
    gitRequired: true
    backends: [kiro, ollama]
    profiles: [audit, plan, review]      # implement not allowed (no ollama writer)
    guardedPaths:
      - .env
      - "**/*.pem"
      - "**/id_rsa*"
    # Additional read restrictions for Ollama O1 (trusted config only, not
    # caller-controlled). Uses the same applyPolicy glob grammar as guardedPaths.
    sensitiveReadGlobs:
      - "config/clients.yaml"
      - "config/bridge.yaml"
      - "**/*.key"
      - "**/secrets/**"

# Profiles are ENFORCEMENT POLICY, not prompt templates. The container/OS
# layer consumes this specification and enforces it at the runner boundary.
profiles:
  - id: audit
    workspaceAccess: read-only
    shellPolicy: read-only
    gitPolicy: read
    networkPolicy: backend-only
    defaultResourcePolicy: economy

  - id: plan
    workspaceAccess: read-only
    shellPolicy: none
    gitPolicy: read
    networkPolicy: backend-only
    defaultResourcePolicy: economy

  - id: implement                        # the ONLY writer profile in v1
    workspaceAccess: sandbox-write       # sandbox copy — never the live project
    shellPolicy: validation
    gitPolicy: sandbox
    networkPolicy: backend-only
    defaultResourcePolicy: standard

  - id: review
    workspaceAccess: read-only
    shellPolicy: validation
    gitPolicy: read
    networkPolicy: backend-only
    defaultResourcePolicy: standard

# Deterministic integer units: CPU in millicores, sizes in bytes, time in ms.
# maxProviderCredits is in provider-specific units (Kiro credits and Copilot
# credits are NOT economically comparable; no dollar estimates are derived).
resourcePolicies:
  - id: economy
    modelClass: fast
    maxRuntimeMs: 600000                 # 10 min
    maxCpuMillicores: 1000
    maxMemoryBytes: 1073741824           # 1 GiB
    maxPids: 128
    maxOutputBytes: 262144               # 256 KiB
    maxEvidenceBytes: 10485760           # 10 MiB
    networkPolicy: backend-only
    retentionClass: ephemeral

  - id: standard
    modelClass: standard
    maxRuntimeMs: 1800000                # 30 min
    maxCpuMillicores: 2000
    maxMemoryBytes: 2147483648           # 2 GiB
    maxPids: 256
    maxOutputBytes: 262144
    maxEvidenceBytes: 52428800           # 50 MiB
    networkPolicy: backend-only
    retentionClass: short

  - id: deep
    modelClass: deep
    maxRuntimeMs: 3600000                # 60 min
    maxCpuMillicores: 4000
    maxMemoryBytes: 4294967296           # 4 GiB
    maxPids: 512
    maxOutputBytes: 262144
    maxEvidenceBytes: 104857600          # 100 MiB
    maxProviderCredits: 100              # example provider-unit budget
    networkPolicy: backend-only
    retentionClass: audit
