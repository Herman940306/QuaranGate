# Read-only review target for the mcp-ide-bridge repository itself.
# Exposes the development repository to ChatGPT for independent code review.
# The source mount is read-only; writable locations for npm/test/build are
# provided as tmpfs volumes.
name: mcp-ide-bridge-review

services:
  review:
    build:
      context: .
    image: mcp-bridge-review:latest
    container_name: mcp-bridge-review
    working_dir: /workspace
    # Opt-in discovery labels
    labels:
      mcp.bridge.enabled: "true"
      mcp.bridge.workspace: "/workspace"
      mcp.bridge.name: "mcp-ide-bridge-review"
    # git and python3 are baked into the image at build time — no runtime apk.
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    volumes:
      # READ-ONLY mount of the source repository
      - /home/herman/projects/mcp-ide-bridge:/workspace:ro
      # Writable locations for tooling that needs temp/cache space
      - review-node-modules:/workspace/node_modules
      - review-dist:/workspace/dist
    tmpfs:
      - /tmp
      - /root/.npm
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: false  # Container filesystem is read-only except tmpfs/volumes
    pids_limit: 256
    mem_limit: 2g

volumes:
  review-node-modules:
    name: mcp-bridge-review-node-modules
  review-dist:
    name: mcp-bridge-review-dist
