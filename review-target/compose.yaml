# Read-only review target for the QuaranGate repository.
# This target is intended for independent source inspection/review only.
# It is NOT a build or write workspace.
# The source repository is mounted read-only; no writes to /workspace are
# permitted. /tmp and existing tmpfs entries remain available for transient
# scratch space inside the container.
name: mcp-ide-bridge-review
services:
  review:
    build:
      context: .
    image: mcp-bridge-review:latest
    container_name: mcp-bridge-review
    working_dir: /workspace
    user: "${REVIEW_UID:-1000}:${REVIEW_GID:-1000}"
    # Opt-in discovery labels
    labels:
      mcp.bridge.enabled: "true"
      mcp.bridge.workspace: "/workspace"
      mcp.bridge.name: "mcp-ide-bridge-review"
    # git and python3 are baked into the image at build time - no runtime apk.
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    volumes:
      # READ-ONLY bind of the source repository.
      # Set REVIEW_REPO_PATH to point at an immutable audit checkout, e.g.:
      #   REVIEW_REPO_PATH=/path/to/immutable-audit-checkout
      # Defaults to the repository root (parent of review-target/).
      - type: bind
        source: ${REVIEW_REPO_PATH:-..}
        target: /workspace
        read_only: true
    tmpfs:
      - /tmp
      - /root/.npm
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Container root filesystem is not locked to read-only at this layer;
    # the repository bind above enforces read-only access to /workspace.
    read_only: false
    pids_limit: 256
    mem_limit: 2g
