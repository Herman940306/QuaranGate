# QuaranGate — standalone deployment. Owns only its own networks/services.
# Does NOT touch existing project stacks.
# Compose project name below (`mcp-ide-bridge`) is a legacy runtime identifier
# retained for compatibility; see MCP_IDE_BRIDGE_MASTER_PRD.md §47 for the
# migration contract.

name: mcp-ide-bridge

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  read_only: true
  restart: unless-stopped

services:
  gateway:
    <<: *hardening
    build:
      context: .
    # One shared build artifact, independently taggable per service. Production
    # must pin an immutable service-specific tag (quarangate:gateway-<sha>);
    # the :latest default is a dev convenience and is never authoritative.
    image: ${GATEWAY_IMAGE:-mcp-ide-bridge:latest}
    command: ["node", "dist/gateway/index.js"]
    environment:
      BRIDGE_PORT: "8787"
      BRIDGE_PUBLIC_URL: "${BRIDGE_PUBLIC_URL:-http://127.0.0.1:8787}"
      EXECUTOR_URL: "http://executor:8990"
      INTERNAL_TOKEN: "${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}"
      DATA_DIR: "/data"
      CLIENTS_CONFIG: "/config/clients.yaml"
    ports:
      # Bind to loopback only. Remote ingress is documented but NOT enabled here.
      - "127.0.0.1:${BRIDGE_PORT:-8787}:8787"
    volumes:
      - ./config:/config:ro
      - bridge-data:/data
    tmpfs:
      - /tmp
    networks:
      - edge
      - internal
    depends_on:
      - executor
    healthcheck:
      # Readiness, not liveness: an empty /config mount (clients.yaml missing)
      # must report UNHEALTHY instead of falsely healthy. The process is not
      # killed or restarted by this check changing state; it stays diagnosable.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    pids_limit: 256

  executor:
    <<: *hardening
    # Same shared build artifact as the gateway, tagged independently
    # (quarangate:executor-<sha> in production).
    image: ${EXECUTOR_IMAGE:-mcp-ide-bridge:latest}
    build:
      context: .
    command: ["node", "dist/executor/index.js"]
    environment:
      EXECUTOR_PORT: "8990"
      INTERNAL_TOKEN: "${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}"
      BRIDGE_CONFIG: "/config/bridge.yaml"
      DOCKER_SOCK: "/var/run/docker.sock"
      # Agent Control Plane (A2): optional trusted config + durable job store.
      AGENTS_CONFIG: "/config/agents.yaml"
      JOBS_DB: "/jobs/agents.db"
      # A4 real read-only Kiro backend (trusted, executor-only). When these are
      # all set the factory wires the real KiroBackend for backend=kiro; unset =
      # fake-only. None are caller-selectable. The runner image MUST be the real
      # :a4 (kiro-cli + kiro-cli-chat), never the :a4-test stub. The proxy runs
      # the bridge image itself (contains the compiled egress proxy; no bind).
      AGENT_RUNNER_IMAGE: "${AGENT_RUNNER_IMAGE:-}"
      AGENT_PROXY_IMAGE: "${AGENT_PROXY_IMAGE:-}"
      # Executor-internal path of the RO key FILE (never the value). The key is
      # delivered via the compose secret below, executor-only.
      AGENT_KIRO_KEY_PATH: "${AGENT_KIRO_KEY_PATH:-}"
      # Zero-inference verification switch (stop after ACP session/new).
      AGENT_KIRO_DRY_RUN: "${AGENT_KIRO_DRY_RUN:-}"
    # Access to the docker socket is confined to THIS private service only.
    group_add:
      - "${DOCKER_GID:-1001}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./config:/config:ro
      # Executor-owned agent job persistence. NOT mounted into the gateway or
      # any target; separate trust domain from the gateway OAuth /data volume.
      - bridge-jobs:/jobs
    # A4 dedicated Kiro API key — delivered ONLY to the executor (the trusted
    # execution authority), as a read-only file, owned by the runtime user
    # (uid 1000) mode 0400. The raw value never appears in env/labels/args/logs;
    # the executor reads the FILE and hands the bytes to the runner via a
    # job-scoped secret volume (never Docker Env). The gateway never receives it.
    secrets:
      - source: kiro_api_key
        target: kiro-api-key
        uid: "1000"
        gid: "1000"
        mode: 0400
    tmpfs:
      - /tmp
    networks:
      - internal
    # No published ports. Reachable only from the gateway over the internal net.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8990/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    pids_limit: 512

networks:
  edge:
    name: mcp-bridge-edge
  internal:
    name: mcp-bridge-internal
    internal: true

volumes:
  bridge-data:
    name: mcp-bridge-data
  bridge-jobs:
    name: mcp-bridge-jobs

secrets:
  # Dedicated Kiro API key host file (0600, herman-owned). Read by the docker
  # daemon at deploy time and mounted read-only into the EXECUTOR only. Never
  # committed to Git; only the file path is referenced here.
  kiro_api_key:
    file: ${AGENT_KIRO_KEY_FILE:-/home/herman/.config/mcp-ide-bridge/kiro-api-key}
